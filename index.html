<style>

.tag.t-renfort{color:var(--bad);border-color:var(--bad)}.tag.t-asso{color:var(--warn);border-color:var(--warn)}.tag.t-verif{color:var(--muted)}.tag.t-avance{color:var(--good);border-color:var(--good)}
.lg{display:inline-block;width:14px!important;height:10px!important;border:1px solid var(--line);vertical-align:middle;margin-right:5px}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
#gate .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(420px,100%);display:grid;gap:14px}
#gate h1{font-family:var(--f-display);font-size:24px;margin:0;display:flex;align-items:center;gap:10px}
#gate h1 i{width:12px;height:12px;border-radius:50%;background:var(--sun);display:inline-block}
#gate p{margin:0;color:var(--muted)}
#gate label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
#gate input{font-size:16px;padding:10px 12px}
#gate .btn{padding:10px 14px;font-size:15px}
#gate .err{color:var(--bad);font-size:13px;min-height:1em}
#gate .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}#gate .sep::before,#gate .sep::after{content:"";flex:1;height:1px;background:var(--line)}
#gate a{color:var(--accent);font-size:13px;cursor:pointer}
.who{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
</style>
<script>
window.STANDALONE = true;
(function () {
  const $g = () => document.getElementById('gate');
  const gateHTML = inner => `<div class="card"><h1><i></i>Atterrissage</h1>${inner}</div>`;
  function show(inner) { const g = $g(); if (!g) return; g.innerHTML = gateHTML(inner); g.hidden = false; }
  function hide() { const g = $g(); if (g) g.hidden = true; }
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('A_REMPLACER')) {
    document.addEventListener('DOMContentLoaded', () => show('<p><b>Configuration manquante.</b></p><p>Le fichier <code>firebase-config.js</code> n\'est pas encore rempli. Suivez l\'étape 3 du guide d\'installation, puis rechargez la page.</p>'));
    window.claude = { use: async () => null }; return;
  }
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  fs.settings({ ignoreUndefinedProperties: true, merge: true });
  function loginForm(msg) {
    show(`<p>Direct Sud · suivi des volumes. Connectez-vous pour accéder aux données.</p>
      <button class="btn" id="gGoogle" type="button">Se connecter avec Google</button>
      <div class="sep">ou</div>
      <form id="gForm" style="display:grid;gap:12px">
        <label>Adresse e-mail<input type="email" id="gMail" autocomplete="username" required></label>
        <label>Mot de passe<input type="password" id="gPass" autocomplete="current-password" required></label>
        <div class="err" id="gErr">${msg || ''}</div>
        <button class="btn pri" type="submit">Se connecter</button>
        <a id="gReset">Mot de passe oublié ?</a>
      </form>`);
    const err = t => { document.getElementById('gErr').textContent = t; };
    const fr = e => ({ 'auth/invalid-credential': 'Adresse ou mot de passe incorrect.', 'auth/wrong-password': 'Adresse ou mot de passe incorrect.', 'auth/user-not-found': 'Adresse ou mot de passe incorrect.', 'auth/too-many-requests': 'Trop de tentatives : réessayez dans quelques minutes.', 'auth/popup-closed-by-user': 'Connexion Google annulée.', 'auth/unauthorized-domain': 'Ce site n\'est pas encore autorisé dans Firebase (étape 5 du guide).' }[e.code] || ('Connexion impossible (' + (e.code || e.message) + ').'));
    document.getElementById('gForm').addEventListener('submit', e => { e.preventDefault(); err(''); auth.signInWithEmailAndPassword(document.getElementById('gMail').value.trim(), document.getElementById('gPass').value).catch(x => err(fr(x))); });
    document.getElementById('gGoogle').addEventListener('click', () => { err(''); auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(x => err(fr(x))); });
    document.getElementById('gReset').addEventListener('click', () => { const m = document.getElementById('gMail').value.trim(); if (!m) return err('Saisissez d\'abord votre adresse e-mail.'); auth.sendPasswordResetEmail(m).then(() => err('E-mail de réinitialisation envoyé à ' + m + '.')).catch(x => err(fr(x))); });
  }
  function refused() {
    const u = auth.currentUser;
    show(`<p><b>Accès refusé.</b></p><p>Le compte <b>${(u && u.email || '').replace(/[<>&"]/g, '')}</b> n'est pas autorisé à consulter ces données. Demandez à l'administrateur de l'ajouter dans les règles Firestore (étape 4 du guide).</p><button class="btn" id="gOut" type="button">Changer de compte</button>`);
    document.getElementById('gOut').addEventListener('click', () => auth.signOut().then(() => location.reload()));
  }
  let resolveReady; const ready = new Promise(r => resolveReady = r);
  auth.onAuthStateChanged(u => {
    if (!u) { document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', () => loginForm()) : loginForm(); return; }
    hide(); resolveReady(u);
    const put = () => { const bar = document.querySelector('header .bar'); if (!bar || document.getElementById('who')) return;
      const w = document.createElement('span'); w.className = 'who'; w.id = 'who'; w.textContent = u.email || '';
      const b = document.createElement('button'); b.className = 'btn sm'; b.type = 'button'; b.textContent = 'Se déconnecter'; b.addEventListener('click', () => auth.signOut().then(() => location.reload()));
      w.appendChild(b); bar.appendChild(w); };
    document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', put) : put();
  });
  /* adaptateur : même interface que la base Claude utilisée par l'outil */
  const onErr = (cb) => (e) => { if (e && e.code === 'permission-denied') refused(); if (cb) cb(e); };
  const wrapCol = (c) => ({ doc: id => fs.collection(c).doc(id), onSnapshot: (next, err) => fs.collection(c).onSnapshot(next, onErr(err)) });
  const db = { collection: wrapCol, doc: p => fs.doc(p) };
  const downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return { status: 'saved' }; } };
  window.claude = { use: async (name) => { await ready; if (name === 'db') return db; if (name === 'downloads') return downloads; if (name === 'user') return { can: async () => true }; return null; } };
})();
</script>

<script>
/* ===== Moteur de calcul (fonctions pures) ===== */
const DAY = 86400000;
const P = iso => Date.parse(iso + 'T00:00:00Z');
const ISO = t => new Date(t).toISOString().slice(0, 10);
const addD = (iso, n) => ISO(P(iso) + n * DAY);
function mon(iso) { const t = P(iso); const wd = (new Date(t).getUTCDay() + 6) % 7; return ISO(t - wd * DAY); }
function isoWeek(iso) {
  const d = new Date(P(iso)); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3);
  const fy = d.getUTCFullYear(); const f = new Date(Date.UTC(fy, 0, 4));
  return 1 + Math.round(((d - f) / DAY - 3 + ((f.getUTCDay() + 6) % 7)) / 7);
}
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');

async function readFile(file) {
  imp = { name: file.name, error: null };
  try {
    if (typeof XLSX === 'undefined') throw new Error('Le lecteur de fichiers Excel ne s\'est pas chargé. Rechargez la page.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', raw: true, cellDates: false });
    const sn = wb.SheetNames[0]; const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const kind = detectKind(aoa);
    if (!kind) throw new Error('Format non reconnu : il faut un export AlloHouston des bulletins (colonnes « ID unique », « Code mission ») ou du suivi des heures (« Code interne », « Heures »).');
    imp.kind = kind;
    if (kind === 'heures') { imp.list = parseHeures(aoa); imp.agg = aggregateHeures(imp.list, S); }
    else {
      imp.list = parseBulletins(aoa);
      const known = new Set(); Object.values(S.imports).forEach(d => (d.ids || []).forEach(i => known.add(String(i)))); imp.known = known;
      const vals = imp.list.map(x => x.val || x.eng).sort(); imp.span = [vals[0], vals[vals.length - 1]];
      const dm = (sn + ' ' + file.name).match(/(\d{2})[\/_.-](\d{2})[\/_.-](\d{4})/);
      imp.remise = dm ? `${dm[3]}-${dm[2]}-${dm[1]}` : today();
      imp.mode = (P(imp.span[1]) - P(imp.span[0])) / DAY <= 10 ? 'hebdo' : 'historique';

}
async function runImport() {
  const btn = document.querySelector('[data-impgo]'); if (btn) { btn.disabled = true; btn.textContent = 'Import en cours…'; }
  try {
    if (imp.kind === 'heures') {
      const { W, NA } = imp.agg;
      for (const [mid, v] of Object.entries(W)) {
        const prev = (S.heures[mid] && S.heures[mid].weeks) || {};
        const weeks = Object.assign({}, prev, v.weeks);
        await db.collection('heures').doc(mid).set({ weeks, src: v.src, maj: today() });
      }
      await db.doc('config/heures').set({ fichier: imp.name, maj: today(), nbLignes: imp.list.length, na: NA.map(x => ({ ...x, h: Math.round(x.h * 10) / 10 })) });

    } else {
      imp.mode = $('#impMode').value; imp.remise = $('#impRemise').value || today();

      const id = 'i' + imp.remise.replace(/-/g, '') + '-' + Date.now().toString(36);
      const CH = 700; const parts = Math.ceil(nw.length / CH);
      for (let i = 0; i < parts; i++) {

        await db.collection('imports').doc(id + '-p' + i).set({ importId: id, part: i, parts, remise: imp.remise, fichier: imp.name, cree: new Date().toISOString(), nbTotal: nw.length, nb: chunk.length, mode: imp.mode, ids: chunk.map(x => x.id), rows: aggregateBulletins(chunk, imp.mode, imp.remise) });
      }

    imp = null; render();
  } catch (e) { writeErr(e); if (btn) { btn.disabled = false; btn.textContent = 'Réessayer'; } }
}

  if (t.dataset.cad) { S.cad[t.dataset.cad] = t.value; render(); return; }
  if (t.dataset.f && t.dataset.f !== 'q') { S.f[t.dataset.f] = t.value; render(); return; }
  if (t.id === 'restoreFile' && t.files[0]) { const fl = t.files[0]; t.value = ''; try { const d = JSON.parse(await fl.text()); if (d.format !== 'atterrissage-direct-sud') throw 0; const n = ['assos', 'missions', 'imports', 'heures', 'config'].reduce((s, c) => s + Object.keys(d[c] || {}).length, 0); S._restore = { name: fl.name, data: d, n, date: dfr((d.date || '').slice(0, 10)) }; render(); } catch (_) { toast('Ce fichier n\'est pas une sauvegarde de l\'outil Atterrissage.'); } return; }
  if (t.id === 'file' && t.files[0]) { readFile(t.files[0]); t.value = ''; return; }
  if (t.dataset.map !== undefined && t.value) { const mp = Object.assign({}, S.cfg.mappings || {}, { [t.dataset.map]: t.value });
    try { await db.doc('config/main').set(Object.assign({}, S.cfg, { mappings: mp })); toast('Bulletins rattachés'); } catch (er) { writeErr(er); } return; }
  if (t.id === 'impMode' && imp) { imp.mode = t.value; }
});
let qT = null;
document.addEventListener('input', e => { if (e.target.id === 'fq') { clearTimeout(qT); qT = setTimeout(() => { S.f.q = e.target.value; render(); const i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('on'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('on'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('on'); const f = e.dataTransfer.files[0]; if (f) readFile(f); } });
let rT = null; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (S.tab === 'synthese' && model) drawChart(model); }, 200); });

/* ---------- Démarrage ---------- */
function setSync(state, txt) { const el = $('#sync'); el.className = 'sync ' + state; el.querySelector('span').textContent = txt; }
async function boot() {
  const yearSel = $('#year'); const y0 = new Date().getFullYear();
  yearSel.innerHTML = [y0 - 2, y0 - 1, y0, y0 + 1].map(y => `<option value="${y}">${y}</option>`).join('');
  S.year = y0 - (new Date().getMonth() < 1 ? 1 : 0);
  render();
  if (!window.claude || !window.claude.use) { setSync('err', 'Hors ligne'); return; }
  db = await window.claude.use('db');
  if (!db) { setSync('err', 'Données indisponibles'); render(); return; }
  window.claude.use('downloads').then(d => downloads = d);
  window.claude.use('user').then(async u => { if (!u) return; try { const c = await u.can('data.write'); if (c === false) { S.canWrite = false; render(); } } catch (_) {} });
  setSync('', 'Connexion…');
  const timer = setTimeout(() => { if (S.loaded < 5) setSync('err', 'Données injoignables pour le moment'); }, 10000);
  const seen = new Set();
  const mark = (k, snap) => { if (!snap.metadata.fromCache && !seen.has(k)) { seen.add(k); S.loaded = seen.size; if (S.loaded >= 5) { clearTimeout(timer); setSync('ok', 'Données à jour'); } } };
  const err = er => { setSync('err', 'Connexion interrompue'); };
  const sub = (col, key) => db.collection(col).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { o[d.id] = Object.assign({ _id: d.id }, d.data()); }); S[key] = o; mark(col, snap); dirty = true; if (!pending) render(); }, err);
  sub('assos', 'assos'); sub('missions', 'missions'); sub('imports', 'imports'); sub('heures', 'heures');
  db.collection('config').onSnapshot(snap => { snap.docs.forEach(d => { if (d.id === 'main') S.cfg = Object.assign({ grille: {}, mappings: {}, seuil: 5 }, d.data()); if (d.id === 'heures') S.heuresMeta = d.data(); }); mark('config', snap); dirty = true; if (!pending) render(); }, err);
}
boot();

</script>
